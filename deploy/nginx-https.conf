# Nginx: HTTPS for AppManager. server_name = your DDNS hostname (e.g. blackgrid.ddns.net).
# Cert paths are Let's Encrypt (certbot). __DDNS_ADDRESS__ replaced during deploy.

# HTTP → HTTPS redirect and ACME challenge for renewal
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DDNS_ADDRESS__;

    root /var/www/appmanager-acme;
    location /.well-known/acme-challenge/ {
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __DDNS_ADDRESS__;

    ssl_certificate     /etc/letsencrypt/live/__DDNS_ADDRESS__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DDNS_ADDRESS__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
