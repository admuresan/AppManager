# Nginx: make "localhost" (port 80) show AppManager running on 8080
#
# 1. Install Nginx:  sudo apt-get install -y nginx
# 2. Copy this file:  sudo cp /BlackGrid/appmanager/deploy/nginx-port80-to-8080.conf /etc/nginx/sites-available/appmanager
# 3. Enable site:     sudo ln -sf /etc/nginx/sites-available/appmanager /etc/nginx/sites-enabled/
# 4. Remove default:  sudo rm -f /etc/nginx/sites-enabled/default   # optional, if you want only AppManager on 80
# 5. Test and reload: sudo nginx -t && sudo systemctl reload nginx
#
# Then http://localhost (port 80) will forward to AppManager on 8080.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
