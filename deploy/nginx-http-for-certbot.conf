# Nginx: port 80 only, for initial Let's Encrypt HTTP-01 challenge and serving app.
# server_name must be your DDNS hostname (e.g. blackgrid.ddns.net).
# Replace __DDNS_ADDRESS__ during deploy. After cert is obtained, deploy nginx-https.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DDNS_ADDRESS__;

    root /var/www/appmanager-acme;
    location /.well-known/acme-challenge/ {
        allow all;
    }

    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
